# Render Blueprint — reproducible deploy config for the ResearchForge backend.
#
# Usage: In the Render dashboard, choose "New Blueprint" and point it at this
# repo. Render reads this file and provisions the service automatically.
# You will still be prompted to fill in the `sync: false` secret values by
# hand (API keys are never stored in this file or committed to git).
#
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: researchforge-backend
    runtime: python
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      # Secrets — fill these in via the Render dashboard, not here.
      - key: OPENROUTER_API_KEY
        sync: false
      - key: MISTRAL_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: LANGSMITH_API_KEY
        sync: false

      # Non-secret config — safe defaults, edit here or override in dashboard.
      - key: ALLOWED_ORIGINS
        value: http://localhost:5173
        # After deploying the frontend to Vercel, update this in the Render
        # dashboard to include your production URL, e.g.:
        # http://localhost:5173,https://your-app.vercel.app
      - key: DEBUG
        value: "false"
      - key: LANGSMITH_TRACING
        value: "false"
      - key: LANGSMITH_PROJECT
        value: ResearchForge
      - key: PYTHON_VERSION
        value: 3.12.0